services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: downloader-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CLIPSTREAM_DOWNLOAD_DIR=/app/downloads
      - CLIPSTREAM_USERNAME=
      - CLIPSTREAM_PASSWORD=
      - CLIPSTREAM_SHARE_TOKEN=
    volumes:
      - ./backend/downloads:/app/downloads
