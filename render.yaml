services:
  - type: web
    name: downloader
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PORT
        value: "10000"
      - key: CLIPSTREAM_HOST
        value: 0.0.0.0
      - key: CLIPSTREAM_USERNAME
        value: downloader
      - key: CLIPSTREAM_PASSWORD
        generateValue: true
      - key: CLIPSTREAM_DOWNLOAD_DIR
        value: /data/downloads
      - key: CLIPSTREAM_DOWNLOAD_WORKERS
        value: "2"
    disk:
      name: downloader-files
      mountPath: /data/downloads
      sizeGB: 10
